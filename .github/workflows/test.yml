name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install 'websockets>=15,<17' tomli pyyaml
      - run: python -m unittest discover -s tests -v
      - run: bash -n skills/codex-bg/scripts/*.sh
      - run: python -m py_compile skills/codex-bg/scripts/*.py
